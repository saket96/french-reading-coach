services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    environment:
      # base is stable on Mac CPU; French soft-matching covers many near-misses.
      # For higher accuracy later you can try: ASR_MODEL: small
      ASR_MODEL: base
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper-model-cache:/root/.cache
    restart: unless-stopped

  # Phoneme-level French pronunciation (OpenPronounce, experimental for FR).
  # First start downloads ~2 GB of Wav2Vec2 weights into pronounce-model-cache.
  pronounce:
    build: ./pronounce
    ports:
      - "8000:8000"
    environment:
      OPENPRONOUNCE_DEVICE: cpu
      OPENPRONOUNCE_TTS: gtts
      HF_HOME: /models
    volumes:
      - pronounce-model-cache:/models
    restart: unless-stopped

  # Vite dev server — opens on http://127.0.0.1:4378 (no separate npm run dev needed)
  web:
    build: ./web
    ports:
      - "4378:4378"
    environment:
      WHISPER_URL: http://whisper:9000
      PRONOUNCE_URL: http://pronounce:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - whisper
      - pronounce
    restart: unless-stopped

volumes:
  whisper-model-cache:
  pronounce-model-cache:
  web_node_modules:
