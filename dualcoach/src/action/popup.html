<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      :root {
        --bg: #fffaf2;
        --text: #1f2a24;
        --muted: #5c675f;
        --line: #d9cfc0;
        --accent: #2f6f5e;
        --accent-bg: #e7efe8;
        --radius: 10px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #24302a;
          --text: #f6f1e7;
          --muted: #a8b0aa;
          --line: #3a4540;
          --accent: #c8e6d8;
          --accent-bg: #2a3d35;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 260px;
        background: var(--bg);
        color: var(--text);
        font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
        font-size: 13.5px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .head img {
        width: 16px;
        height: 16px;
        display: block;
      }

      .brand {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }

      .row-main {
        min-width: 0;
        flex: 1 1 auto;
      }

      .row-label {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-sub {
        display: block;
        margin-top: 1px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row.is-disabled .row-label,
      .row.is-disabled .row-sub {
        color: var(--muted);
      }

      /* switch */
      .switch {
        position: relative;
        flex: 0 0 auto;
        width: 34px;
        height: 20px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      .switch .track {
        display: block;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: var(--line);
        transition: background 0.12s ease;
        pointer-events: none;
      }

      .switch .track::after {
        content: "";
        display: block;
        width: 16px;
        height: 16px;
        margin: 2px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
        transform: translateX(0);
        transition: transform 0.12s ease;
      }

      .switch input:checked + .track {
        background: var(--accent);
      }

      .switch input:checked + .track::after {
        transform: translateX(14px);
      }

      .switch input:focus-visible + .track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .switch input:disabled {
        cursor: default;
      }

      .switch input:disabled + .track {
        opacity: 0.45;
      }

      /* status */
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--muted);
      }

      .dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .dot.on {
        background: var(--accent);
      }

      .status-text {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* languages */
      .langs {
        display: grid;
        gap: 8px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }

      .lang {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .lang label {
        color: var(--muted);
        font-size: 12.5px;
        white-space: nowrap;
      }

      .lang select {
        min-width: 0;
        max-width: 150px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
      }

      .lang select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* footer */
      .foot {
        padding: 12px 14px;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--accent-bg);
        color: var(--accent);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--accent);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <img src="../../icons/icon32.png" alt="" />
      <div>
        <div class="brand" data-i18n="brand"></div>
        <div class="row-sub" style="margin-top:2px">Coach de lecture française</div>
      </div>
    </div>

    <div class="row">
      <div class="row-main">
        <label class="row-label" for="enabled">Enabled</label>
      </div>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </span>
    </div>

    <div class="row" id="site-row">
      <div class="row-main">
        <span class="row-label" id="site-host">This site</span>
        <span class="row-sub" id="site-sub">Works on YouTube and Netflix</span>
      </div>
      <span class="switch">
        <input type="checkbox" id="site-enabled" />
        <span class="track"></span>
      </span>
    </div>

    <div class="langs">
      <div class="lang">
        <label for="learnLang">I'm learning</label>
        <select id="learnLang"></select>
      </div>
      <div class="lang">
        <label for="nativeLang">My language</label>
        <select id="nativeLang"></select>
      </div>
    </div>

    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Checking…</span>
    </div>

    <div class="status">
      <span class="dot" id="provider-dot"></span>
      <span class="status-text" id="provider-text">AI explanations: checking…</span>
    </div>

    <div class="foot">
      <button class="btn" id="open-options" type="button">Settings</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
