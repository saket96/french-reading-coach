<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DualCoach — Coach de lecture française</title>
    <link rel="icon" href="icon128.png" />
    <style>
      :root {
        --bg: #f6f1e7;
        --fg: #1f2a24;
        --muted: #5c675f;
        --line: #d9cfc0;
        --accent: #2f6f5e;
        --card: #fffaf2;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.65 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      header img {
        width: 40px;
        height: 40px;
      }
      h1 {
        font-size: 28px;
        margin: 0;
      }
      .tag {
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      a {
        color: var(--accent);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.25rem;
        margin-top: 1.5rem;
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="tag">Coach de lecture française</p>
      <header>
        <img src="icon128.png" alt="" />
        <h1>DualCoach</h1>
      </header>
      <p>
        Dual subtitles for YouTube and Netflix — learning language on top, your language below.
        Click words for definitions, save vocabulary, optional OpenRouter free AI explanations.
      </p>
      <div class="card">
        <p>
          <a href="privacy.html">Privacy policy</a> ·
          <a href="https://saketsuman.com/contact/">Contact</a> ·
          <a href="https://github.com/saket96/french-reading-coach">GitHub</a>
        </p>
      </div>
      <p class="muted">Not affiliated with Netflix or YouTube.</p>
    </main>
  </body>
</html>
